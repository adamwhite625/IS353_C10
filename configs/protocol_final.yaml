version: 2
architecture: gcn
device: cpu
torch_threads: 2
dataset_order: [bashapes, cora]
datasets:
  bashapes:
    source: archived_t06
    data_sha256: 8fbf94a7ce5850dbdae4a0cd13b178aaa3db1b7009a12efcef8e47306b2c3c73
    split_seed: 0
    test_nodes: all
  cora:
    source: archived_t06
    data_sha256: f2846a82cdd1e5b5a0804baad24c997a7720b27155a6c9655730bd6c42836268
    test_nodes: 100
    sample_seed: 0
gnn_seeds: [1000, 1001, 1002, 1003, 1004]
fixed_gnn_seed: 1000
bashapes_replacement:
  next_seed: 1005
  min_test_accuracy: 0.85
  min_test_class_3_recall: 0.50
checkpoint_targets:
  bashapes: {test_accuracy: 0.90, test_class_3_recall: 0.85}
  cora: {test_accuracy: 0.80}
methods: [saliency, gnnexplainer, pgexplainer]
explainer_seeds: [0, 1, 2, 3, 4]
saliency_seeds: [0]
saliency_fixed_gnn_seeds: [0, 1]
pgexplainer_fit_split: train
target_class: checkpoint_prediction
candidates: {hops: 2, undirected: true, self_loops: false}
budgets: [1, 3, 5, 10]
main_budget: 5
baselines: [random, nearest_first]
baseline_repeat_seeds: [0, 1, 2, 3, 4]
tie_policy: seeded_uniform_permutation_shared_across_budgets
tie_sensitivity_seeds: [0, 1, 2, 3, 4]
metrics:
  fidelity: [fid_drop, fid_inv]
  ground_truth: [roc_auc, average_precision, precision]
  agreement: [kappa, jaccard, kendall_tau_b]
  undefined: nan_with_reason
  keep_negative_fidelity: true
statistics:
  sample_sd_ddof: 1
  bootstrap: {unit: node, repeats: 2000, confidence: 0.95}
  paired_test: wilcoxon_signed_rank
  adjustment: holm
error_analysis:
  quadrant_thresholds: [[0.10, 0.75], [0.05, 0.70], [0.20, 0.80]]
  historical_node: 692
